# Régénère les pages SEO (histoires, genres, sitemap, flux Atom, llms) depuis Firestore, les teste,
# les commite sur la branche par défaut, déploie Hosting (OIDC + Workload Identity Federation, aucune clé)
# sur exactement ce commit, puis notifie IndexNow des URL nouvelles ou modifiées de ce même commit.
# Idempotent : sans histoire nouvelle/modifiée, aucun commit, aucun déploiement, aucune notification.
# Variables requises : GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT (non secrètes) ; sans elles,
# la régénération et le commit ont lieu mais le déploiement et IndexNow sont ignorés.
# Épinglage : le SHA ci-dessous est le commit de merge de la PR AppFactory #149.
name: SEO refresh

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Autoriser une baisse massive du nombre d'histoires (dépublication volontaire)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosting-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.push.outputs.sha }}
    env:
      FIREBASE_PROJECT: love-ink
      SITE_BASE_URL: https://loveink.site
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0

      - name: Conserver le sitemap courant
        run: cp sitemap.xml "$RUNNER_TEMP/sitemap.before.xml"

      - name: Régénérer les pages
        run: node scripts/build-seo-pages.mjs ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      - name: Tests SEO
        run: node --test tests/seo/*.test.mjs

      - name: Détecter les changements
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit et push
        id: push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "seo: régénération des pages histoires, sitemap et flux [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Conserver l'ancien sitemap pour IndexNow
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sitemap-before
          path: ${{ runner.temp }}/sitemap.before.xml
          retention-days: 1

  deploy:
    needs: refresh
    if: ${{ needs.refresh.outputs.changed == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    permissions:
      contents: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-firebase-deploy.yml@ec566364c51f4d5f4e5289db9bdab682dda5ee7c
    with:
      appfactory_ref: ec566364c51f4d5f4e5289db9bdab682dda5ee7c
      mode: production
      firebase_project_id: love-ink
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      targets: hosting
      checkout_ref: ${{ needs.refresh.outputs.sha }}
      build_command: ""
      github_environment: production

  indexnow:
    needs: [refresh, deploy]
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.deployed_sha == needs.refresh.outputs.sha }}
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: https://loveink.site
    steps:
      - name: Checkout du commit déployé
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.deploy.outputs.deployed_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0

      - name: Récupérer l'ancien sitemap
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: sitemap-before
          path: ${{ runner.temp }}

      - name: Notifier IndexNow
        run: node scripts/indexnow.mjs --previous "$RUNNER_TEMP/sitemap.before.xml"
