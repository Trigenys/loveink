<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - Love Ink</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260325-brand3">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .messagerie-page {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 64px);
            overflow: hidden;
        }
        .messagerie-page h1 {
            padding: 20px 30px 10px;
            margin: 0;
            font-family: 'Baskerville', serif;
            color: #b76e6e;
            flex-shrink: 0;
        }
        .messagerie-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            border-top: 1px solid #e6d5cc;
        }

        /* Colonne gauche — liste conversations */
        .conversations-list {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e6d5cc;
            background: #fdf8f5;
            overflow: hidden;
        }
        .conversations-search {
            padding: 14px 16px;
            border-bottom: 1px solid #e6d5cc;
            flex-shrink: 0;
        }
        .conversations-search input {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid #e6d5cc;
            border-radius: 20px;
            font-family: 'Century Gothic', sans-serif;
            font-size: 0.85rem;
            background: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .conversations-search input:focus {
            border-color: #b76e6e;
        }
        #conversationsList {
            flex: 1;
            overflow-y: auto;
        }
        .conv-empty {
            padding: 40px 20px;
            text-align: center;
            color: #a08070;
            font-family: 'Century Gothic', sans-serif;
            font-size: 0.9rem;
        }
        .conversation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0e4de;
            transition: background 0.15s;
            position: relative;
        }
        .conversation-item:hover { background: #f5ede8; }
        .conversation-item.active { background: #f0e4de; }
        .conv-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .conv-avatar-wrap .avatar-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #e6d5cc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b76e6e;
            font-size: 1.5rem;
        }
        .unread-dot {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: #b76e6e;
            border-radius: 50%;
            border: 2px solid #fdf8f5;
        }
        .online-dot-small {
            position: absolute;
            right: -1px;
            bottom: -1px;
            width: 11px;
            height: 11px;
            background: #4caf7d;
            border-radius: 50%;
            border: 2px solid #fdf8f5;
        }
        .conv-info { flex: 1; min-width: 0; }
        .conv-name {
            font-family: 'Century Gothic', sans-serif;
            font-weight: bold;
            font-size: 0.9rem;
            color: #3d2b1f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-preview {
            font-family: 'Century Gothic', sans-serif;
            font-size: 0.8rem;
            color: #8a6a5a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .conv-time {
            font-size: 0.75rem;
            color: #a08070;
            flex-shrink: 0;
            font-family: 'Century Gothic', sans-serif;
        }

        /* Colonne droite — chat */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a08070;
            font-family: 'Century Gothic', sans-serif;
            gap: 12px;
        }
        .chat-empty i { font-size: 3rem; color: #d4b5a8; }
        .chat-empty p { font-size: 0.95rem; }
        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-bottom: 1px solid #e6d5cc;
            background: #fdf8f5;
            flex-shrink: 0;
        }
        .chat-header .avatar-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e6d5cc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b76e6e;
            font-size: 1.4rem;
        }
        .chat-header-name {
            font-family: 'Century Gothic', sans-serif;
            font-weight: bold;
            color: #3d2b1f;
        }
        .chat-header-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-header-status {
            font-family: 'Century Gothic', sans-serif;
            font-size: 0.75rem;
            color: #9b7b6b;
        }
        .chat-header-status.online {
            color: #3b9c6d;
        }
        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 68%;
            padding: 10px 14px;
            border-radius: 16px;
            font-family: 'Century Gothic', sans-serif;
            font-size: 0.88rem;
            line-height: 1.45;
            word-break: break-word;
        }
        .message.sent {
            align-self: flex-end;
            background: #b76e6e;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            align-self: flex-start;
            background: #f0e4de;
            color: #3d2b1f;
            border-bottom-left-radius: 4px;
        }
        .msg-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }
        .message.received .msg-time { text-align: left; }
        .chat-input {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid #e6d5cc;
            background: #fdf8f5;
            flex-shrink: 0;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e6d5cc;
            border-radius: 24px;
            font-family: 'Century Gothic', sans-serif;
            font-size: 0.88rem;
            outline: none;
            background: #fff;
        }
        .chat-input input:focus { border-color: #b76e6e; }
        .chat-input button {
            background: #b76e6e;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.95rem;
            transition: background 0.15s;
        }
        .chat-input button:hover { background: #a05858; }
        .chat-input button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
    <link rel="stylesheet" href="css/immersive.css">
    <script src="js/core/immersive.js" defer></script>
</head>
<body>
    <div id="appNavRoot"></div>
    <script type="module">
        import { mountAppNav } from './js/components/nav-component.js?v=20260325-logo';
        mountAppNav({ variant: 'classic', active: 'messagerie', showUser: true, showPublish: true });
    </script>

    <div class="messagerie-page">
        <h1>Ma messagerie</h1>
        <div class="messagerie-container">
            <!-- Colonne gauche -->
            <div class="conversations-list">
                <div class="conversations-search">
                    <input type="text" id="searchInput" placeholder="Rechercher une conversation…">
                </div>
                <div id="conversationsList">
                    <div class="conv-empty">Chargement…</div>
                </div>
            </div>

            <!-- Colonne droite -->
            <div class="chat-area">
                <div id="chatEmpty" class="chat-empty">
                    <i class="fas fa-comments"></i>
                    <p>Sélectionnez une conversation</p>
                </div>

                <div id="chatPanel" style="display:none; flex-direction:column; overflow:hidden; flex:1;">
                    <div class="chat-header" id="chatHeader">
                        <div class="avatar-icon"><i class="fas fa-user"></i></div>
                        <div class="chat-header-meta">
                            <span class="chat-header-name" id="chatHeaderName">…</span>
                            <span class="chat-header-status" id="chatHeaderStatus">Hors ligne</span>
                        </div>
                    </div>
                    <div id="chatMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Écrivez votre message…">
                        <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/core/firebase-config.js';
        import { logoutAndRedirect, requireAuth } from './js/core/auth-session.js';
        import { setNavPseudo, wireNavInteractions } from './js/components/nav-component.js?v=20260325-logo';
        import { firebaseAPI } from './js/core/firebase-data.js';
        import { getPresenceMeta } from './js/core/presence.js';

        // ── State ──────────────────────────────────────────────────────────────
        let currentUser = null;
        let activeConvId = null;
        let unsubConv = null;
        let unsubMsg = null;
        let conversationsCache = [];
        const usersCache = new Map();

        // ── DOM refs ───────────────────────────────────────────────────────────
        const convListEl   = document.getElementById('conversationsList');
        const chatEmpty    = document.getElementById('chatEmpty');
        const chatPanel    = document.getElementById('chatPanel');
        const chatHeaderName = document.getElementById('chatHeaderName');
        const chatHeaderStatus = document.getElementById('chatHeaderStatus');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn      = document.getElementById('sendBtn');
        const searchInput  = document.getElementById('searchInput');

        // ── Helpers ────────────────────────────────────────────────────────────
        function formatTime(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            const now = new Date();
            const sameDay = d.toDateString() === now.toDateString();
            if (sameDay) return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return 'Hier';
            return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
        }

        const USER_CACHE_TTL_MS = 30 * 1000;

        async function getUser(uid, options = {}) {
            const { force = false } = options;
            const cached = usersCache.get(uid);
            if (!force && cached && (Date.now() - Number(cached._cachedAt || 0)) < USER_CACHE_TTL_MS) {
                return cached;
            }
            try {
                const u = await firebaseAPI.getUtilisateur(uid);
                const user = { ...(u || { pseudo: uid }), _cachedAt: Date.now() };
                usersCache.set(uid, user);
                return user;
            } catch {
                return { pseudo: uid, _cachedAt: Date.now() };
            }
        }

        function getPresenceLabel(user) {
            const { online, lastSeen } = getPresenceMeta(user);
            if (online) return { text: 'En ligne', online: true };
            if (lastSeen) return { text: `Vu ${formatTime(lastSeen)}`, online: false };
            return { text: 'Hors ligne', online: false };
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ── Render conversations ───────────────────────────────────────────────
        async function renderConversations(convs) {
            conversationsCache = convs;
            const query = searchInput.value.trim().toLowerCase();
            applyFilter(query);
        }

        async function applyFilter(query) {
            const filtered = query
                ? conversationsCache.filter(c => {
                    const otherId = c.participants.find(p => p !== currentUser.uid);
                    const cached = usersCache.get(otherId);
                    return cached && cached.pseudo.toLowerCase().includes(query);
                })
                : conversationsCache;

            convListEl.innerHTML = '';

            if (filtered.length === 0) {
                convListEl.innerHTML = '<div class="conv-empty">Aucune conversation</div>';
                return;
            }

            for (const conv of filtered) {
                const otherId = conv.participants.find(p => p !== currentUser.uid);
                const other = await getUser(otherId);
                const hasUnread = conv.expediteurDernierMessage && conv.expediteurDernierMessage !== currentUser.uid;
                const presence = getPresenceLabel(other);

                const item = document.createElement('div');
                item.className = 'conversation-item' + (conv.id === activeConvId ? ' active' : '');
                item.dataset.convId = conv.id;
                item.innerHTML = `
                    <div class="conv-avatar-wrap">
                        <div class="avatar-icon"><i class="fas fa-user"></i></div>
                        ${presence.online ? '<span class="online-dot-small"></span>' : ''}
                        ${hasUnread ? '<span class="unread-dot"></span>' : ''}
                    </div>
                    <div class="conv-info">
                        <div class="conv-name">${escHtml(other.pseudo || otherId)}</div>
                        <div class="conv-preview">${escHtml(conv.dernierMessage || '')}</div>
                    </div>
                    <div class="conv-time">${formatTime(conv.derniereActivite)}</div>
                `;
                item.addEventListener('click', () => ouvrirConversation(conv.id, other));
                convListEl.appendChild(item);
            }
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ── Open conversation ──────────────────────────────────────────────────
        async function ouvrirConversation(convId, other) {
            if (unsubMsg) { unsubMsg(); unsubMsg = null; }
            activeConvId = convId;

            const conv = conversationsCache.find((item) => item.id === convId);
            const otherId = conv?.participants?.find((p) => p !== currentUser.uid);
            if (otherId) {
                other = await getUser(otherId, { force: true });
            }

            // Update active class
            document.querySelectorAll('.conversation-item').forEach(el => {
                el.classList.toggle('active', el.dataset.convId === convId);
                // Remove unread dot for active
                if (el.dataset.convId === convId) {
                    el.querySelector('.unread-dot')?.remove();
                }
            });

            // Show chat panel
            chatEmpty.style.display = 'none';
            chatPanel.style.display = 'flex';
            chatPanel.style.flexDirection = 'column';
            chatPanel.style.overflow = 'hidden';
            chatPanel.style.flex = '1';

            // Header
            if (other) {
                chatHeaderName.textContent = other.pseudo || convId;
                const presence = getPresenceLabel(other);
                chatHeaderStatus.textContent = presence.text;
                chatHeaderStatus.classList.toggle('online', presence.online);
            }

            // Mark as read
            firebaseAPI.marquerMessagesLus(convId, currentUser.uid).catch(() => {});

            // Listen messages
            chatMessages.innerHTML = '';
            unsubMsg = firebaseAPI.ecouterMessages(convId, renderMessages);
        }

        // ── Render messages ────────────────────────────────────────────────────
        function renderMessages(msgs) {
            chatMessages.innerHTML = '';
            for (const msg of msgs) {
                const div = document.createElement('div');
                div.className = 'message ' + (msg.expediteurId === currentUser.uid ? 'sent' : 'received');

                const text = document.createTextNode(msg.contenu || '');
                div.appendChild(text);

                const timeDiv = document.createElement('div');
                timeDiv.className = 'msg-time';
                timeDiv.textContent = formatTime(msg.date);
                div.appendChild(timeDiv);

                chatMessages.appendChild(div);
            }
            scrollToBottom();
        }

        // ── Send message ───────────────────────────────────────────────────────
        async function handleSend() {
            const contenu = messageInput.value.trim();
            if (!contenu || !activeConvId) return;
            messageInput.value = '';
            sendBtn.disabled = true;
            try {
                await firebaseAPI.envoyerMessage(activeConvId, contenu);
            } catch (e) {
                console.error('Erreur envoi message:', e);
                messageInput.value = contenu;
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        messageInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });

        // ── Search filter ──────────────────────────────────────────────────────
        searchInput.addEventListener('input', () => applyFilter(searchInput.value.trim().toLowerCase()));

        // ── Start conversation listener ────────────────────────────────────────
        function demarrerConversations(userId) {
            unsubConv = firebaseAPI.ecouterConversations(userId, async convs => {
                await renderConversations(convs);
            });
        }

        // ── Nav wiring ─────────────────────────────────────────────────────────
        wireNavInteractions({
            variant: 'classic',
            onLogout: async () => {
                await logoutAndRedirect({ auth, redirectTo: 'index.html' });
            }
        });

        // ── Init ───────────────────────────────────────────────────────────────
        requireAuth({
            auth,
            redirectTo: 'index.html',
            onReady: async (fbUser, { pseudo }) => {
                currentUser = { uid: fbUser.uid, pseudo };
                usersCache.set(fbUser.uid, { pseudo });
                setNavPseudo(pseudo);

                demarrerConversations(fbUser.uid);

                // ?with=uid — open or create conversation from profile page
                const withUid = new URLSearchParams(location.search).get('with');
                if (withUid && withUid !== fbUser.uid) {
                    try {
                        const convId = await firebaseAPI.getOuCreerConversation(fbUser.uid, withUid);
                        if (convId) {
                            const other = await getUser(withUid, { force: true });
                            ouvrirConversation(convId, other);
                        }
                    } catch (e) {
                        console.error('Impossible d\'ouvrir la conversation:', e);
                    }
                }
            }
        });

        window.addEventListener('beforeunload', () => {
            unsubConv?.();
            unsubMsg?.();
        });
    </script>
</body>
</html>
