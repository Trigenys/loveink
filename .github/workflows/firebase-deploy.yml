# Déploiement Firebase sans clé : OIDC GitHub + Workload Identity Federation (workflow réutilisable AppFactory).
# Pull request : mode plan (build + contrat, aucun identifiant). Push sur la branche par défaut : production,
# limité à cette branche par le contrat, le workflow réutilisable et l'environnement GitHub "production".
# Change-scoped : l'analyse d'impact (.github/appfactory-impact.json) décide des gates seo-tests / rules-tests / e2e /
# hosting / firestore. Les e2e et les tests de règles tournent sur la Firebase Emulator Suite (projet demo-*),
# jamais contre la production.
# Tant que les variables GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_DEPLOY_SERVICE_ACCOUNT ne sont pas définies
# (bootstrap humain : docs/gcp-wif-one-time-bootstrap.md du dépôt AppFactory), tout reste en mode plan.
# Épinglage : le SHA ci-dessous est le commit de merge de la PR AppFactory #152 (inclut #149 à #151).
name: Firebase Deploy

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosting-deploy
  cancel-in-progress: false

jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@814c71785d520a7b307e39d2d3aeeeec39df6e0a
    with:
      appfactory_ref: 814c71785d520a7b307e39d2d3aeeeec39df6e0a
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  seo-tests:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'seo-tests') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0
      - run: node --test tests/seo/*.test.mjs

  rules-tests:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'rules-tests') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules

  e2e:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Garde-fou : la configuration Playwright refuse tout hôte distant sans E2E_ALLOW_PROD=1.
      E2E_ALLOW_PROD: '0'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  hosting:
    needs: [impact, seo-tests, e2e]
    if: ${{ !cancelled() && needs.seo-tests.result != 'failure' && needs.e2e.result != 'failure' && contains(fromJSON(needs.impact.outputs.gates), 'hosting') }}
    permissions:
      contents: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-firebase-deploy.yml@814c71785d520a7b307e39d2d3aeeeec39df6e0a
    with:
      appfactory_ref: 814c71785d520a7b307e39d2d3aeeeec39df6e0a
      mode: ${{ (github.event_name == 'pull_request' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '') && 'plan' || 'production' }}
      firebase_project_id: love-ink
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      targets: hosting
      checkout_ref: ${{ github.sha }}
      build_command: node scripts/fingerprint-assets.mjs
      github_environment: ${{ github.event_name == 'pull_request' && '' || 'production' }}

  firestore:
    needs: [impact, hosting, rules-tests, e2e]
    if: ${{ !cancelled() && (needs.hosting.result == 'success' || needs.hosting.result == 'skipped') && needs.rules-tests.result != 'failure' && needs.e2e.result != 'failure' && github.event_name != 'pull_request' && contains(fromJSON(needs.impact.outputs.gates), 'firestore') }}
    permissions:
      contents: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-firebase-deploy.yml@814c71785d520a7b307e39d2d3aeeeec39df6e0a
    with:
      appfactory_ref: 814c71785d520a7b307e39d2d3aeeeec39df6e0a
      mode: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && 'plan' || 'production' }}
      firebase_project_id: love-ink
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      targets: firestore:rules,firestore:indexes
      checkout_ref: ${{ github.sha }}
      build_command: ""
      github_environment: production
