<!DOCTYPE html>
<html lang="fr" class="li-public">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Love Ink</title>
    <link rel="canonical" href="https://loveink.site/register">
    <meta name="description" content="Créez votre compte Love Ink gratuitement : un pseudo, une adresse e-mail, et vous lisez des histoires d'amour en français dans la minute.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Love Ink">
    <meta property="og:title" content="Inscription - Love Ink">
    <meta property="og:description" content="Créez votre compte Love Ink gratuitement : un pseudo, une adresse e-mail, et vous lisez des histoires d'amour en français dans la minute.">
    <meta property="og:url" content="https://loveink.site/register">
    <meta property="og:image" content="https://loveink.site/images/og-love-ink.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260325-brand3">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/immersive.css">
    <link rel="stylesheet" href="css/auth-form.css">
    <link rel="stylesheet" href="css/auth-action.css">
    <link rel="stylesheet" href="css/ink-quill.css">
    <script src="js/core/immersive.js" defer></script>
    <script src="js/core/ink-quill.js" defer></script>
</head>
<body>
    <div class="li-ink" data-ink-quill aria-hidden="true"></div>
    <div class="auth-container">
        <div class="auth-card aa-card">
            <a href="index.html" class="logo-custom" style="justify-content: center; margin-bottom: 20px;">
                <div class="logo-icon">
                    <i class="fas fa-heart logo-heart"></i>
                    <i class="fas fa-hand-paper logo-hand"></i>
                    <i class="fas fa-pen-fancy logo-pen"></i>
                </div>
                <span class="logo-text">Love Ink</span>
            </a>
            <span class="aa-kicker aa-in">Inscription</span>
            <h1 class="aa-title aa-in">Rejoignez <em>l'aventure</em></h1>
            <p class="aa-text aa-in">Créez votre compte d'auteur ou de lecteur en une minute.</p>
            
            <form class="auth-form aa-in" id="registerForm" novalidate>
                <div class="form-group">
                    <label for="pseudo">Pseudo</label>
                    <input type="text" id="pseudo" name="username" autocomplete="username" maxlength="40" required autofocus>
                    <p class="form-hint" id="pseudo-hint">Le nom que verront les lecteurs. 2 à 40 caractères.</p>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" inputmode="email" spellcheck="false" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="pw-field">
                        <input type="password" id="password" name="new-password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint">
                        <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Afficher le mot de passe" aria-pressed="false"><i class="fas fa-eye" aria-hidden="true"></i></button>
                    </div>
                    <p class="form-hint" id="password-hint">8 caractères minimum. Une phrase facile à retenir fait un excellent mot de passe.</p>
                    <div class="pw-meter" id="pwMeter" hidden aria-live="polite"><span class="pw-meter__bar" aria-hidden="true"></span><span class="pw-meter__label"></span></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <div class="pw-field">
                        <input type="password" id="confirmPassword" name="confirm-password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="pw-toggle" data-toggle-password="confirmPassword" aria-label="Afficher le mot de passe" aria-pressed="false"><i class="fas fa-eye" aria-hidden="true"></i></button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="type">Je suis</label>
                    <select id="type" name="type" required>
                        <option value="lecteur">Lecteur (je veux lire)</option>
                        <option value="auteur">Auteur (je veux publier)</option>
                        <option value="lesdeux">Les deux !</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bio">Bio <span class="form-optional">(facultatif)</span></label>
                    <textarea id="bio" name="bio" rows="3" maxlength="600"></textarea>
                </div>

                <label class="form-consent" for="consent">
                    <input type="checkbox" id="consent" name="consent" required>
                    <span>J'ai lu et j'accepte les <a href="conditions.html" target="_blank" rel="noopener">conditions d'utilisation</a> et la <a href="confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>.</span>
                </label>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%;">Créer mon compte</button>
            </form>
            
            <div class="auth-footer">
                <p>Déjà inscrit ? <a href="login.html">Connectez-vous</a></p>
                <p class="li-made-by">Made <em>by</em> <a href="https://trigenys.com" rel="noopener">Trigenys Group</a></p>
            </div>
        </div>
    </div>

    <script src="js/components/modale.js"></script>
    <script type="module">
    import {
        createUserWithEmailAndPassword,
        sendEmailVerification,
        updateProfile
    } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
    import { doc, serverTimestamp, setDoc } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
    import { auth, db } from './js/core/firebase-config.js';
    import { notify } from './js/components/ui-notify.js';
    import { syncUserSession } from './js/core/auth-session.js';
    import { requestVerificationEmail } from './js/core/mailer-client.js';
    import {
        PASSWORD_MIN, authErrorMessage, clearErrors, fieldError, focusFirstInvalid,
        isValidEmail, setBusy, wirePasswordToggles, wireStrengthMeter
    } from './js/components/auth-form.js';

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const f = (id) => document.getElementById(id);
    const DEFAULT_BIO = 'Amoureux(se) des mots';
    let submitting = false;

    wirePasswordToggles(form);
    wireStrengthMeter(f('password'), f('pwMeter'), () => [f('pseudo').value.trim(), f('email').value.split('@')[0]]);
    form.querySelectorAll('input, select, textarea').forEach((el) => {
        el.addEventListener('input', () => fieldError(el, null));
    });

    function validate() {
        clearErrors(form);
        const pseudo = f('pseudo').value.trim();
        const email = f('email').value.trim();
        const password = f('password').value;
        const confirm = f('confirmPassword').value;
        if (pseudo.length < 2 || pseudo.length > 40) fieldError(f('pseudo'), 'Choisissez un pseudo de 2 à 40 caractères.');
        if (!isValidEmail(email)) fieldError(f('email'), 'Saisissez une adresse e-mail valide.');
        if (password.length < PASSWORD_MIN) fieldError(f('password'), `Le mot de passe doit faire au moins ${PASSWORD_MIN} caractères.`);
        if (confirm !== password) fieldError(f('confirmPassword'), 'Les deux mots de passe ne sont pas identiques.');
        if (f('bio').value.trim().length > 600) fieldError(f('bio'), 'La bio est limitée à 600 caractères.');
        if (!f('consent').checked) fieldError(f('consent'), "Vous devez accepter les conditions pour créer un compte.");
        return !focusFirstInvalid(form);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (submitting || !validate()) return;
        submitting = true;
        setBusy(submitBtn, true, 'Création du compte…');

        const pseudo = f('pseudo').value.trim();
        const email = f('email').value.trim();
        const password = f('password').value;
        const type = f('type').value;
        const bio = f('bio').value.trim() || DEFAULT_BIO;

        try {
            const { user } = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(user, { displayName: pseudo }).catch(() => {});

            const profile = { pseudo, type, bio, dateInscription: new Date().toISOString() };
            try {
                await setDoc(doc(db, 'utilisateurs', user.uid), {
                    uid: user.uid, pseudo, type, bio,
                    dateInscription: serverTimestamp(), abonnes: 0, histoires: 0
                }, { merge: true });
            } catch {
                // Le profil Firestore sera recree a la prochaine connexion ; la session locale suffit pour continuer.
            }
            syncUserSession(user, profile);

            let verifySent = false;
            // E-mail thématisé via le service mailer ; repli sur l'e-mail texte Firebase s'il est injoignable.
            verifySent = await requestVerificationEmail(user, pseudo);
            if (!verifySent) { try { await sendEmailVerification(user); verifySent = true; } catch { /* non bloquant */ } }

            await notify('success',
                verifySent
                    ? `Bienvenue ${pseudo} ! Un e-mail de confirmation vient de vous être envoyé à ${email}. Pensez à vérifier vos courriers indésirables.`
                    : `Bienvenue ${pseudo} !`,
                { title: 'Compte créé' });
            window.location.href = 'feed.html';
        } catch (error) {
            const message = authErrorMessage(error, 'register');
            if (error?.code === 'auth/email-already-in-use' || error?.code === 'auth/invalid-email') {
                fieldError(f('email'), message); f('email').focus();
            } else if (error?.code === 'auth/weak-password') {
                fieldError(f('password'), message); f('password').focus();
            } else {
                await notify('error', message, { title: 'Inscription' });
            }
        } finally {
            submitting = false;
            setBusy(submitBtn, false);
        }
    });
    </script>
</body>
</html>
