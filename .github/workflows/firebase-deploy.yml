# Déploiement Firebase sans clé : OIDC GitHub + Workload Identity Federation (workflow réutilisable AppFactory).
# Pull request : mode plan (build + contrat, aucun identifiant). Push sur la branche par défaut : production,
# limité à cette branche par le contrat, le workflow réutilisable et l'environnement GitHub "production".
# Change-scoped : l'analyse d'impact (.github/appfactory-impact.json) décide des gates seo-tests / hosting / firestore.
# Tant que les variables GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_DEPLOY_SERVICE_ACCOUNT ne sont pas définies
# (bootstrap humain : docs/gcp-wif-one-time-bootstrap.md du dépôt AppFactory), tout reste en mode plan.
# Épinglage : le SHA ci-dessous est le commit de merge de la PR AppFactory #151 (inclut #149 et #150).
name: Firebase Deploy

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosting-deploy
  cancel-in-progress: false

jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@fdca41d5b7f1656f88d8a01dc4d3de3213b834a5
    with:
      appfactory_ref: fdca41d5b7f1656f88d8a01dc4d3de3213b834a5
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  seo-tests:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'seo-tests') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0
      - run: node --test tests/seo/*.test.mjs

  hosting:
    needs: [impact, seo-tests]
    if: ${{ !cancelled() && needs.seo-tests.result != 'failure' && contains(fromJSON(needs.impact.outputs.gates), 'hosting') }}
    permissions:
      contents: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-firebase-deploy.yml@fdca41d5b7f1656f88d8a01dc4d3de3213b834a5
    with:
      appfactory_ref: fdca41d5b7f1656f88d8a01dc4d3de3213b834a5
      mode: ${{ (github.event_name == 'pull_request' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '') && 'plan' || 'production' }}
      firebase_project_id: love-ink
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      targets: hosting
      checkout_ref: ${{ github.sha }}
      build_command: ""
      github_environment: ${{ github.event_name == 'pull_request' && '' || 'production' }}

  firestore:
    needs: [impact, hosting]
    if: ${{ !cancelled() && (needs.hosting.result == 'success' || needs.hosting.result == 'skipped') && github.event_name != 'pull_request' && contains(fromJSON(needs.impact.outputs.gates), 'firestore') }}
    permissions:
      contents: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-firebase-deploy.yml@fdca41d5b7f1656f88d8a01dc4d3de3213b834a5
    with:
      appfactory_ref: fdca41d5b7f1656f88d8a01dc4d3de3213b834a5
      mode: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && 'plan' || 'production' }}
      firebase_project_id: love-ink
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      targets: firestore:rules,firestore:indexes
      checkout_ref: ${{ github.sha }}
      build_command: ""
      github_environment: production
