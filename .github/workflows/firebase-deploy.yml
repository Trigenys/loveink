# Déploiement à chaque push sur la branche par défaut (et à la demande).
# Hosting : toujours, via compte de service (secret FIREBASE_SERVICE_ACCOUNT_LOVE_INK, rôle Firebase Hosting Admin).
# Règles / index Firestore : seulement si firestore.rules ou firestore.indexes.json ont changé (change-scoped),
# ce qui demande en plus le rôle Cloud Datastore Index Admin + Firebase Rules Admin sur le même compte.
name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Secret de déploiement présent
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOVE_INK }}" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_LOVE_INK absent : créer un compte de service (rôle Firebase Hosting Admin) et coller son JSON dans les secrets du dépôt."
            exit 1
          fi

      - name: Tests SEO
        run: node --test tests/seo/*.test.mjs

      - name: Surfaces impactées
        id: impact
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "firestore=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^firestore\.(rules|indexes\.json)$'; then
            echo "firestore=true" >> "$GITHUB_OUTPUT"
          else
            echo "firestore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOVE_INK }}
          projectId: love-ink
          channelId: live

      - name: Déployer règles et index Firestore
        if: steps.impact.outputs.firestore == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOVE_INK }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore --project love-ink --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
